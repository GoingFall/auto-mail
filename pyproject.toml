[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mail"
version = "0.1.0"
description = "自用网易邮箱(163)管理助手：抽取邮件中的事件时间并写入 Google 日历"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # 配置
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # CLI / 输出
    "typer>=0.12",
    "rich>=13.7",
    # IMAP：imapclient 自带 RFC 2971 ID（163 必需）、mUTF-7 文件夹解码、IDLE
    "imapclient>=3.0",
    # MIME / 正文处理
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
    # 时间解析
    "dateparser>=1.2",
    "python-dateutil>=2.9",
    # ICS
    "icalendar>=6.0",
    # Google Calendar
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    # LLM（OpenAI 兼容）
    "openai>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
automail = "automail.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automail = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:automail.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # 行宽由 ruff format 统一处理，不单独报错
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
